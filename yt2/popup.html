<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 14px;
      font: 13px/1.4 -apple-system, system-ui, sans-serif;
      color: #1a1a1a;
      background: #fff;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e8e8e8; background: #202124; }
      select { background: #2b2c2f; color: #e8e8e8; border-color: #555; }
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title { font-weight: 600; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .row:last-child { margin-bottom: 0; }
    select {
      width: 72px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 2px 4px;
      font: inherit;
    }
    /* toggle switch */
    .switch { position: relative; width: 34px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #bbb;
      border-radius: 18px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }
    input:checked + .slider { background: #1565c0; }
    input:checked + .slider::before { transform: translateX(16px); }
    .disabled-area { opacity: 0.45; pointer-events: none; }
    #channelSection hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 10px 0;
    }
    @media (prefers-color-scheme: dark) {
      #channelSection hr { border-top-color: #555; }
    }
    #channelSection .row { cursor: pointer; }
    #channelName {
      display: block;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">YT Auto Speed</span>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>
  <div id="controls">
    <div class="row">
      <span>Default speed</span>
      <select id="normalSpeed">
        <option value="1">1×</option>
        <option value="1.1">1.1×</option>
        <option value="1.2">1.2×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
    </div>
    <div class="row">
      <span>Music speed</span>
      <select id="musicSpeed">
        <option value="0">Off</option>
        <option value="0.75">0.75×</option>
        <option value="1">1×</option>
        <option value="1.1">1.1×</option>
        <option value="1.2">1.2×</option>
        <option value="1.25">1.25×</option>
      </select>
    </div>
    <div id="channelSection" hidden>
      <hr>
      <label class="row">
        <span>
          Always treat channel as music
          <span id="channelName"></span>
        </span>
        <input type="checkbox" id="channelMusic">
      </label>
    </div>
  </div>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
